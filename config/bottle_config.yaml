category: bottle

data:
  manifest_path: data/manifests/bottle.csv
  image_size: 224
  val_split: 0.3
  seed: 42

model:
  architecture: resnet18   # resnet18, efficientnet_b0, or simple_cnn
  pretrained: true
  num_classes: 2

defect_classifier:
  use_focused_crops: false

train:
  batch_size: 16
  epochs: 10
  learning_rate: 0.0001
  num_workers: 2

anomaly_detection:
  backbone: resnet18       # resnet18 or wide_resnet50_2
  layers: [layer2, layer3]
  # coreset_ratio 0.1 previously bound at only 2000 patches (max_coreset_size
  # was the real constraint, not the ratio). A held-out-normal generalization
  # check found that under-covered the true patch population and left a
  # near-miss false-positive risk on unseen normal bottle images (see README
  # "PatchCore generalization check: held-out normal images"). ratio 0.05
  # uncapped by max_coreset_size gave the best held-out margin of everything
  # tested (0.01/0.02/0.05/0.1 ratios, bank augmentation, WideResNet50-2, k=3).
  coreset_ratio: 0.05
  max_coreset_size: 10000
  projection_dim: 128
  batch_size: 16
  # Bottle images are a top-down shot of the bottle mouth that fills the
  # whole frame (no plain background), so the Otsu-based foreground mask
  # (tuned for screw's plain-background assumption) picks an arbitrary
  # dark/light split instead of a real object/background split, and ends
  # up hiding real defect pixels inside the bottle opening. Disable it here.
  use_foreground_mask: false

output:
  checkpoint_dir: models/checkpoints
  metrics_dir: outputs/metrics
  figures_dir: outputs/figures
  heatmaps_dir: outputs/heatmaps
