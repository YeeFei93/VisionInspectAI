category: transistor

data:
  manifest_path: data/manifests/transistor.csv
  image_size: 224
  val_split: 0.3
  seed: 42

model:
  architecture: resnet18   # resnet18, efficientnet_b0, or simple_cnn
  pretrained: true
  num_classes: 2

defect_classifier:
  use_focused_crops: false

train:
  batch_size: 16
  epochs: 10
  learning_rate: 0.0001
  num_workers: 2

anomaly_detection:
  backbone: resnet18       # resnet18 or wide_resnet50_2
  layers: [layer2, layer3]
  coreset_ratio: 0.1
  max_coreset_size: 2000
  projection_dim: 128
  batch_size: 16
  # Transistor is a discrete object like screw/hazelnut, but its background
  # (a perforated copper board) is a busy, non-uniform pattern rather than a
  # plain surface -- the Otsu foreground mask assumes a plain background, so
  # it would also pick up the board's holes as "foreground". Disable masking
  # here; see README "Generalization to Other Categories".
  use_foreground_mask: false

output:
  checkpoint_dir: models/checkpoints
  metrics_dir: outputs/metrics
  figures_dir: outputs/figures
  heatmaps_dir: outputs/heatmaps
