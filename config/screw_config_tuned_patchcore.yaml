category: screw

data:
  manifest_path: data/manifests/screw.csv
  image_size: 224
  val_split: 0.3
  seed: 42

model:
  architecture: resnet18
  pretrained: true
  num_classes: 2

train:
  batch_size: 16
  epochs: 10
  learning_rate: 0.0001
  num_workers: 2
  early_stopping_patience: 3
  early_stopping_min_delta: 0.0

anomaly_detection:
  backbone: resnet18
  layers: [layer2]
  coreset_ratio: 0.1
  max_coreset_size: 4000
  projection_dim: 256
  batch_size: 16

output:
  checkpoint_dir: models/checkpoints
  metrics_dir: outputs/metrics
  figures_dir: outputs/figures
  heatmaps_dir: outputs/heatmaps