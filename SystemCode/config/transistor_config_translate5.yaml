category: transistor

data:
  manifest_path: data/manifests/transistor.csv
  image_size: 224
  val_split: 0.3
  seed: 42

model:
  architecture: resnet18
  pretrained: true
  num_classes: 2

defect_classifier:
  use_focused_crops: false

train:
  batch_size: 16
  epochs: 10
  learning_rate: 0.0001
  num_workers: 2

anomaly_detection:
  backbone: resnet18
  layers: [layer2, layer3]
  coreset_ratio: 0.1
  max_coreset_size: 2000
  projection_dim: 128
  batch_size: 16
  use_foreground_mask: false
  keep_primary_region: true
  primary_region_peak_fraction: 0.10
  train_augmentation:
    translate_ratio: 0.05
    copies: 2
  artifact_name: patchcore_resnet18_transistor_translate5

output:
  checkpoint_dir: models/checkpoints
  metrics_dir: outputs/metrics
  figures_dir: outputs/figures
  heatmaps_dir: outputs/heatmaps